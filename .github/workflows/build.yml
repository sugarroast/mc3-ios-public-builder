name: MC3 iOS Build (public orchestrator)

# Purpose
# -------
# GitHub Actions minutes are free and unmetered for *public* repositories when
# using standard GitHub-hosted runners. This repository exists solely to host
# that trigger. Source code, generated (decompiled) code, the XBE/ISO and all
# game assets stay in PRIVATE repositories and are fetched at build time with a
# read-only token. Nothing proprietary is committed here.
#
# Trigger: workflow_dispatch only. There is deliberately no push, no
# pull_request and no pull_request_target. A run can therefore only be started
# by someone with write access to this repository, which is what makes handing
# it a token safe: a fork cannot start a run that receives secrets.

on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: "Branch or commit SHA in the private source repo to build"
        required: false
        default: "ios-port"
        type: string
      upload_ipa:
        description: "Upload the unsigned .ipa artifact"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mc3-ios-build
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS arm64 game (private source)
    # Standard GitHub-hosted macOS runner. Explicitly NOT a larger runner:
    # GitHub bills larger runners even for public repositories, which would
    # defeat the purpose of this repository.
    #
    # macos-15-intel, not macos-15. Both are valid labels (the runner-images
    # table maps macos-15 to the arm64 image and macos-15-intel to the x64
    # one), and the target is iOS arm64 either way -- the runner only has to
    # cross-compile, and nothing here needs Intel: CMake comes from a Python
    # venv, SDL2 and glslang are built from source, and the MoltenVK tarball
    # is an iOS binary. There are no /usr/local paths and no brew calls.
    #
    # The label is the x64 one because that is the one this repository's pool
    # actually serves. On 2026-11-04 a switch to macos-15 was tried to escape
    # a queue that turned out to be a GitHub Actions outage; once the outage
    # cleared, the macos-15 job sat unassigned until it was cancelled while
    # every earlier macos-15-intel run had been picked up. Revert when the
    # arm64 pool is shown to work for this repository.
    runs-on: macos-15-intel

    env:
      # --- private repositories (read-only access via READ_TOKEN) -----------
      PRIVATE_SOURCE_REPO: sugarroast/mc3dub-ios
      PRIVATE_INPUTS_REPO: sugarroast/mc3-remix-build-inputs
      PRIVATE_INPUTS_TAG: remix-usa-lift-v1
      PRIVATE_INPUTS_ASSET: mc3-remix-usa-generated.tar.gz
      PRIVATE_INPUTS_SHA256: 8a5c5c4afccd03f2bc927c9b0dc7d07ddb12a03d66f8062772d9cf0d60251494

      # --- pinned build dependencies --------------------------------------
      CMAKE_VERSION: 3.27.9
      SDL2_COMMIT: 5d249570393f7a37e037abf22cd6012a4cc56a71
      MOLTENVK_VERSION: 1.4.2
      MOLTENVK_ASSET_URL: https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
      MOLTENVK_SHA256: b5d947b1660e6e9fed40b9cd2387e160aaab9e80b775c0cef7e14059405178c1
      GLSLANG_TAG: 15.1.0

      MC3_GAME: remix
      MC3_GEN_DIR: ${{ github.workspace }}/work-remix/gen
      BUILD_DIR: ${{ github.workspace }}/ios/game/build/ios-device
      MC3_SDL2_SOURCE_DIR: ${{ github.workspace }}/.deps/SDL2
      MC3_MOLTENVK_PACKAGE_DIR: ${{ github.workspace }}/.deps/MoltenVK-1.4.2
      MC3_GLSLANG_SOURCE_DIR: ${{ github.workspace }}/.deps/glslang

    steps:
      - name: Validate token is present
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.MC3_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${READ_TOKEN:-}" ]; then
            echo "::error::secret MC3_PRIVATE_READ_TOKEN is not configured on this repository"
            echo "::error::Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Read token is present."

      - name: Check out private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sugarroast/mc3dub-ios
          ref: ${{ inputs.private_ref }}
          token: ${{ secrets.MC3_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          # Do NOT persist the token into .git/config: later steps run
          # third-party build scripts and must not have a reusable credential
          # lying around in the workspace.
          persist-credentials: false

      - name: Record source revision
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Built from ${PRIVATE_SOURCE_REPO}@${SHA}"
          echo "SOURCE_SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Check out pinned SDL2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: libsdl-org/SDL
          ref: 5d249570393f7a37e037abf22cd6012a4cc56a71
          path: .deps/SDL2
          fetch-depth: 1
          persist-credentials: false

      - name: Check out glslang (pinned tag)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KhronosGroup/glslang
          ref: 15.1.0
          path: .deps/glslang
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned CMake
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install \
            --disable-pip-version-check "cmake==$CMAKE_VERSION"
          CMAKE_BIN="$RUNNER_TEMP/cmake-venv/bin/cmake"
          "$CMAKE_BIN" --version | grep -F "cmake version $CMAKE_VERSION"
          echo "CMAKE_BIN=$CMAKE_BIN" >> "$GITHUB_ENV"

      - name: Download and SHA-verify MoltenVK
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/MoltenVK-ios.tar"
          curl -fsSL -o "$TARBALL" "$MOLTENVK_ASSET_URL"
          echo "$MOLTENVK_SHA256  $TARBALL" | shasum -a 256 -c -
          mkdir -p "${{ github.workspace }}/.deps/MoltenVK-1.4.2"
          tar -xf "$TARBALL" -C "${{ github.workspace }}/.deps/MoltenVK-1.4.2"

      - name: Download private generated code
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.MC3_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          # The token arrives via env and is masked, so it never appears in
          # logs, and never on a command line where the process table shows it.
          GH_TOKEN="$(printf '%s' "$READ_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$GH_TOKEN"
          export GH_TOKEN

          RELEASE_JSON="$RUNNER_TEMP/release.json"
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_INPUTS_REPO}/releases/tags/${PRIVATE_INPUTS_TAG}" \
            --output "$RELEASE_JSON"

          ASSET_ID="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next((str(a["id"]) for a in d.get("assets",[]) if a.get("name")==sys.argv[2]), ""))' \
            "$RELEASE_JSON" "$PRIVATE_INPUTS_ASSET")"
          if [ -z "$ASSET_ID" ]; then
            echo "::error::asset ${PRIVATE_INPUTS_ASSET} not found in release ${PRIVATE_INPUTS_TAG}"
            exit 1
          fi

          ARCHIVE="$RUNNER_TEMP/${PRIVATE_INPUTS_ASSET}"
          curl --fail --location --silent --show-error \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_INPUTS_REPO}/releases/assets/${ASSET_ID}" \
            --output "$ARCHIVE"

          test -s "$ARCHIVE" || { echo "::error::downloaded archive is empty"; exit 1; }
          ACTUAL_SHA="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          echo "Archive size: $(ls -lh "$ARCHIVE" | awk '{print $5}')"
          echo "SHA256: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$PRIVATE_INPUTS_SHA256" ]; then
            echo "::error::SHA256 mismatch for ${PRIVATE_INPUTS_ASSET}"
            exit 1
          fi

          rm -rf work-remix
          mkdir -p work-remix
          tar -xzf "$ARCHIVE" -C work-remix

          # Rename generated sub_<hex> functions to the manual _gen convention.
          #
          # The generated bodies define sub_XXXX; the hand-written manual layer
          # and the dispatch table reference sub_XXXX_gen. This rename is what
          # makes those agree. Without it the link fails with thousands of
          # "symbol(s) not found" for _sub_XXXX_gen.
          #
          # The read MUST fully complete before the file is opened for writing:
          # open(p, "w").write(re.sub(..., open(p).read())) truncates the file
          # before the read runs, leaving every generated .c empty.
          python3 - <<'PY'
          import os
          import re
          import sys

          d = "work-remix/gen"

          if not os.path.isdir(d):
              sys.exit(f"::error::generated source directory not found: {d}")

          sources = sorted(f for f in os.listdir(d) if f.endswith(".c"))
          if not sources:
              sys.exit(f"::error::no generated .c sources found in {d}")

          pattern = re.compile(r"\bsub_([0-9A-Fa-f]+)\b")
          processed = 0
          empty_after = []
          shrank = []

          for name in sources:
              path = os.path.join(d, name)

              with open(path, encoding="utf-8") as handle:
                  src = handle.read()

              before_bytes = len(src.encode("utf-8"))
              if before_bytes == 0:
                  empty_after.append(name)
                  continue

              out = pattern.sub(r"sub_\1_gen", src)
              after_bytes = len(out.encode("utf-8"))

              with open(path, "w", encoding="utf-8") as handle:
                  handle.write(out)

              if os.path.getsize(path) == 0:
                  empty_after.append(name)
                  continue
              if after_bytes < before_bytes // 2:
                  shrank.append(f"{name} {before_bytes}->{after_bytes}")
              processed += 1

          print(f"Generated .c sources found: {len(sources)}")
          print(f"Generated .c sources renamed: {processed}")

          if empty_after:
              print(f"::error::empty generated sources: {', '.join(empty_after)}")
              sys.exit(1)
          if processed != len(sources):
              print(f"::error::renamed {processed} of {len(sources)} sources")
              sys.exit(1)
          if shrank:
              print("::error::sources shrank unexpectedly: " + ", ".join(shrank))
              sys.exit(1)
          # The header declares every translated function and is a separate
          # file, so it must be renamed with the same pattern or the _gen
          # references have no declaration. Runs after the .c loop so header
          # and bodies always agree, and touches one file so the rename cannot
          # be applied twice.
          header_name = "recomp_funcs.h"
          header_path = os.path.join(d, header_name)

          if not os.path.isfile(header_path):
              sys.exit(f"::error::{header_name} missing from generated sources")

          with open(header_path, encoding="utf-8") as handle:
              header_src = handle.read()

          header_before_bytes = len(header_src.encode("utf-8"))
          if header_before_bytes == 0:
              sys.exit(f"::error::{header_name} is empty before rename")
          if "sub_" not in header_src:
              sys.exit(f"::error::{header_name} has no sub_ declarations")

          header_out = pattern.sub(r"sub_\1_gen", header_src)

          with open(header_path, "w", encoding="utf-8") as handle:
              handle.write(header_out)

          header_after_bytes = os.path.getsize(header_path)
          if header_after_bytes == 0:
              sys.exit(f"::error::{header_name} was truncated by the rename")

          with open(header_path, encoding="utf-8") as handle:
              header_check = handle.read()

          header_after_chars = len(header_check.encode("utf-8"))
          if header_after_chars < header_before_bytes:
              sys.exit("::error::{} shrank {}->{} bytes during rename".format(
                  header_name, header_before_bytes, header_after_chars))

          if "_gen_gen" in header_check:
              sys.exit(f"::error::{header_name} gained a double _gen suffix")

          declared_gen = len(re.findall(
              r"^\s*void\s+sub_[0-9A-Fa-f]+_gen\s*\(\s*void\s*\)\s*;",
              header_check, re.M))
          if declared_gen == 0:
              sys.exit(f"::error::{header_name} declares no _gen functions after rename")

          # xbe_entry_point is defined un-suffixed in the bodies, so the header
          # must keep declaring it that way.
          if "void xbe_entry_point(void);" not in header_check:
              sys.exit(f"::error::{header_name} lost the xbe_entry_point declaration")
          if "xbe_entry_point_gen" in header_check:
              sys.exit(f"::error::{header_name} suffixed xbe_entry_point")

          print(f"Generated header renamed: {header_name}")
          print(f"  chars {header_before_bytes} -> {header_after_chars}")
          print(f"  _gen declarations: {declared_gen}")
          PY

          # Re-assert on disk, outside Python, that the sources still hold code.
          if find work-remix/gen -name '*.c' -empty | grep -q .; then
            echo "::error::generated sources are empty after rename"
            exit 1
          fi
          GEN_C_COUNT="$(find work-remix/gen -name '*.c' | wc -l | tr -d ' ')"
          GEN_C_BYTES="$(find work-remix/gen -name '*.c' -exec cat {} + | wc -c | tr -d ' ')"
          echo "Generated files: $GEN_C_COUNT"
          echo "Generated bytes: $GEN_C_BYTES"
          if [ "$GEN_C_COUNT" -eq 0 ] || [ "$GEN_C_BYTES" -eq 0 ]; then
            echo "::error::generated sources are missing or empty"
            exit 1
          fi
          if [ ! -s work-remix/gen/recomp_funcs.h ]; then
            echo "::error::recomp_funcs.h is missing or empty after rename"
            exit 1
          fi
          GEN_HDR_GEN_DECLS="$(grep -c -E '^[[:space:]]*void[[:space:]]+sub_[0-9A-Fa-f]+_gen[[:space:]]*[(][[:space:]]*void[[:space:]]*[)][[:space:]]*;' work-remix/gen/recomp_funcs.h || true)"
          echo "Header _gen declarations: $GEN_HDR_GEN_DECLS"
          if [ "$GEN_HDR_GEN_DECLS" -eq 0 ]; then
            echo "::error::recomp_funcs.h declares no _gen functions after rename"
            exit 1
          fi
          if grep -q '_gen_gen' work-remix/gen/recomp_funcs.h; then
            echo "::error::recomp_funcs.h has a double _gen suffix"
            exit 1
          fi
          if ! grep -q 'void xbe_entry_point(void);' work-remix/gen/recomp_funcs.h; then
            echo "::error::recomp_funcs.h lost the xbe_entry_point declaration"
            exit 1
          fi

          echo "Generated sources unpacked and renamed."

      - name: Configure iOS game
        working-directory: ios/game
        shell: bash
        run: |
          set -euo pipefail
          "$CMAKE_BIN" --preset ios-device

      - name: Build game
        id: build-game
        shell: bash
        run: |
          set -o pipefail
          "$CMAKE_BIN" --build "$BUILD_DIR" --config Release 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-game-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Package IPA
        if: success() && inputs.upload_ipa
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$BUILD_DIR" -name '*.app' -type d | head -n 1)"
          test -d "$APP" || { echo "::error::no .app produced"; exit 1; }
          test -f "$APP/Info.plist" || { echo "::error::missing Info.plist"; exit 1; }

          EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")"
          test -n "$EXECUTABLE" || { echo "::error::empty CFBundleExecutable"; exit 1; }
          test -f "$APP/$EXECUTABLE" || { echo "::error::executable missing"; exit 1; }

          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          ( cd "$RUNNER_TEMP/ipa" && zip -qr "$RUNNER_TEMP/mc3-ios-game.ipa" Payload )

          python3 - "$RUNNER_TEMP/mc3-ios-game.ipa" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = z.namelist()
          assert any(n.startswith('Payload/') and n.endswith('.app/Info.plist')
                     for n in names), 'missing Info.plist'
          print('IPA entries:', len(names))
          PY
          echo "IPA size: $(du -h "$RUNNER_TEMP/mc3-ios-game.ipa" | cut -f1)"

      - name: Upload IPA
        if: success() && inputs.upload_ipa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mc3-ios-game-ipa
          path: ${{ runner.temp }}/mc3-ios-game.ipa
          if-no-files-found: error
          # Artifacts of a public repository are downloadable by anyone who can
          # see the run. Keep the retention window short, download promptly,
          # and delete the artifact once it has been fetched.
          retention-days: 3

      - name: Clean workspace
        if: always()
        shell: bash
        run: |
          # Leave no private source, generated code or credential behind on the
          # runner (runners are ephemeral, but this also keeps artifact upload
          # steps from ever being able to pick these up by accident).
          rm -rf "${{ github.workspace }}/work-remix" \
                 "${{ github.workspace }}/.deps" \
                 "${{ github.workspace }}/src" \
                 "${{ github.workspace }}/ios" \
                 "${{ github.workspace }}/xboxrecomp" \
                 "${{ github.workspace }}/config" 2>/dev/null || true
          echo "Workspace cleaned."
